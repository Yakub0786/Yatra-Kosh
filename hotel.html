<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay details · Yatra Kosh</title>
<meta name="description" content="Room details, amenities and guest ratings for one property.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yatra Kosh">
<meta property="og:title" content="Stay details · Yatra Kosh">
<meta property="og:description" content="Room details, amenities and guest ratings for one property.">
<meta property="og:url" content="https://yakub0786.github.io/Yatra-Kosh/hotel.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Stay details · Yatra Kosh">
<meta name="twitter:description" content="Room details, amenities and guest ratings for one property.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<div class="wrap"><p class="crumb"><a href="index.html">Home</a> / <a href="destinations.html">Destinations</a> / <span id="cr">&hellip;</span></p></div>
<div id="body"></div>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$, param, esc, inr, stars} = App;
  const h = HOTELS.find(x => x.id === param('id'));
  const box = $('#body');

  if(!h){
    box.innerHTML = '<div class="wrap section"><div class="empty"><h3>That stay is no longer listed</h3>' +
      '<p class="muted">Try searching for something similar.</p><a class="btn btn-primary" href="search.html">Search stays</a></div></div>';
    if(window.YK) YK.track('not_found', {category:'error', label:'hotel ' + param('id')});
    return;
  }

  document.title = h.name + ' · Yatra Kosh';
  $('#cr').textContent = h.name;
  const d = DESTINATIONS.find(x=>x.id===h.dest);
  const nearby = HOTELS.filter(x=>x.dest===h.dest && x.id!==h.id).slice(0,2);

  box.innerHTML = `
  <section class="section" style="padding-top:22px">
    <div class="wrap">
      <div id="hotel-hero-art" style="border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-2);aspect-ratio:21/8;position:relative">${Scene.make(h.scene,h.palette,h.id,'xMidYMax slice')}</div>
      <div class="split-side split-side--right" style="margin-top:32px">
        <div>
          <span class="eyebrow">${esc(h.area)} · ${esc(h.destName)}, ${esc(h.state)}</span>
          <h1 style="font-size:clamp(1.8rem,4vw,2.7rem)">${esc(h.name)}</h1>
          <p><span class="stars">${stars(h.stars)}</span> <span class="rating-pill">${h.rating.toFixed(1)} · ${h.reviews} reviews</span></p>
          <p class="lede">${esc(h.blurb)}</p>

          <h3 style="margin-top:30px">What is included</h3>
          <ul class="ticket-amen" style="margin-top:10px">${h.amenities.map(a=>`<li>${esc(AMENITY_LABELS[a]||a)}</li>`).join('')}</ul>

          <h3 style="margin-top:30px">Good to know</h3>
          <div class="panel panel-tight stack" style="font-size:.94rem">
            <div class="boarding-row"><span>Check in / check out</span><span>2:00 PM / 11:00 AM</span></div>
            <div class="boarding-row"><span>Best months to visit</span><span>${esc(d.best)}</span></div>
            <div class="boarding-row"><span>Free cancellation</span><span>Until 72 hours before</span></div>
            <div class="boarding-row" style="border:none"><span>Payment</span><span>At the property</span></div>
          </div>

          <h3 style="margin-top:30px" id="reviews-count">Guest reviews</h3>
          <div id="reviews-list"></div>
          <div id="rv-form-anchor"></div>
        </div>

        <aside>
          <div class="panel" style="position:sticky;top:88px">
            <span class="eyebrow">Per night, before tax</span>
            <p class="ticket-price" style="font-size:2.2rem;text-align:left">${inr(h.price)}<small style="text-align:left">${esc(h.destName)}</small></p>
            <div class="form-grid" style="margin-top:16px">
              <div class="field"><label for="p-in">Check in</label><input type="date" id="p-in"></div>
              <div class="field"><label for="p-out">Check out</label><input type="date" id="p-out"></div>
            </div>
            <p class="mono muted" id="p-total" style="font-size:.82rem"></p>
            <a class="btn btn-primary btn-block" id="book" href="booking.html?hotel=${h.id}" data-track="book now ${esc(h.name)}" data-cat="conversion">Book now</a>
            <p class="hint center" style="margin:12px 0 0">No card needed. Nothing is charged.</p>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <section class="section section--tint">
    <div class="wrap">
      <div class="section-head"><span class="eyebrow">Also in ${esc(h.destName)}</span><h2>Two more options nearby</h2></div>
      <div class="stack">${nearby.map(App.hotelTicket).join('')}</div>
    </div>
  </section>`;

  $('#p-in').value = App.plus(7);
  $('#p-out').value = App.plus(10);

  function total(){
    const a = new Date($('#p-in').value), b = new Date($('#p-out').value);
    const n = Math.max(1, Math.round((b-a)/864e5) || 1);
    const sub = h.price*n, tax = Math.round(sub*0.12);
    $('#p-total').textContent = n + ' NIGHTS · ' + inr(sub) + ' + ' + inr(tax) + ' GST = ' + inr(sub+tax);
    $('#book').href = 'booking.html?hotel=' + h.id + '&cin=' + $('#p-in').value + '&cout=' + $('#p-out').value;
  }
  ['p-in','p-out'].forEach(id=>$('#'+id).addEventListener('change', total));
  total();

  function drawReviews(){
    const rv = App.reviewsBlock(h.id, 4);
    $('#reviews-count').textContent = `Guest reviews (${rv.count}) \u00b7 ${rv.avg} average`;
    $('#reviews-list').innerHTML = rv.html;
  }
  drawReviews();
  $('#rv-form-anchor').innerHTML = App.reviewFormHtml();
  App.wireReviewForm(h.id, drawReviews);

  if(window.Photos) Photos.fillHotelPhoto($('#hotel-hero-art'), h.area, h.state, h.dest);
  if(window.YK) YK.track('hotel_view', {category:'catalogue', label:h.name, value:h.price});
  App.reveals();
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
