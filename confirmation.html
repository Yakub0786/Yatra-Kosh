<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking confirmed · Yatra Kosh</title>
<meta name="description" content="Your booking reference and stay details.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yatra Kosh">
<meta property="og:title" content="Booking confirmed · Yatra Kosh">
<meta property="og:description" content="Your booking reference and stay details.">
<meta property="og:url" content="https://yakub0786.github.io/Yatra-Kosh/confirmation.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Booking confirmed · Yatra Kosh">
<meta name="twitter:description" content="Your booking reference and stay details.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="section">
  <div class="wrap">
    <div class="steps" style="max-width:640px;margin:0 auto 26px">
      <div class="done">01 Choose a stay</div><div class="done">02 Your details</div><div class="done">03 Confirmed</div>
    </div>
    <div id="out"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$, esc, inr} = App;
  let b = null;
  try{ b = JSON.parse(sessionStorage.getItem('yk_booking') || 'null'); }catch(e){}

  if(!b){
    $('#out').innerHTML = '<div class="empty" style="max-width:640px;margin:0 auto">' +
      '<h3>No booking to show</h3><p class="muted">Bookings only live for the current browser session. Start again from a stay.</p>' +
      '<a class="btn btn-primary" href="destinations.html">Browse destinations</a></div>';
    return;
  }

  $('#out').innerHTML = `
  <div class="boarding reveal">
    <div class="boarding-top">
      <div><span class="eyebrow on-dark" style="margin:0">Confirmed</span>
        <p class="boarding-code" style="margin:4px 0 0">${esc(b.ref)}</p></div>
      <div style="width:96px;border-radius:8px;overflow:hidden">${Scene.make(b.scene,b.palette,b.hotel)}</div>
    </div>
    <div class="boarding-body">
      <h2 style="margin-bottom:2px;color:var(--marigold-d)">Thank you, ${esc((b.name||'traveller').split(' ')[0])}!</h2>
      <h3 style="margin-bottom:2px;font-weight:600">${esc(b.hotelName)}</h3>
      <p class="ticket-loc" style="margin-bottom:18px">${esc(b.area)} · ${esc(b.dest)}</p>
      <div class="boarding-row"><span>Guest</span><span>${esc(b.name)}</span></div>
      <div class="boarding-row"><span>Check in</span><span>${esc(b.cin)} · after 2:00 PM</span></div>
      <div class="boarding-row"><span>Check out</span><span>${esc(b.cout)} · before 11:00 AM</span></div>
      <div class="boarding-row"><span>Guests / rooms</span><span>${b.adults!==undefined ? esc(b.adults)+' adult'+(b.adults>1?'s':'')+(b.children?', '+esc(b.children)+' child'+(b.children>1?'ren':''):'') : esc(b.guests)} / ${esc(b.rooms)} room${b.rooms>1?'s':''}</span></div>
      ${b.roomType ? `<div class="boarding-row"><span>Room type</span><span>${esc(b.roomType)}</span></div>` : ''}
      <div class="boarding-row"><span>Nights</span><span>${esc(b.nights)}</span></div>
      ${b.discount ? `<div class="boarding-row"><span>Coupon ${esc(b.couponCode)}</span><span>&minus;${inr(b.discount)}</span></div>` : ''}
      <div class="boarding-row"><span>Payment method</span><span>${esc({upi:'UPI', card:'Credit / Debit Card', cash:'Cash at property'}[b.payMethod] || 'UPI')}</span></div>
      <div class="boarding-row"><span>Payable at property</span><span>${inr(b.total)}</span></div>
      <div class="boarding-row" style="border:none"><span>Confirmation sent to</span><span>${esc(b.email)}</span></div>

      <p class="hint" style="margin-top:18px">A confirmation has been sent to your email. Payment is collected at the property on arrival.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <a class="btn btn-ink" href="packages.html" data-track="after booking browse packages">Browse package tours</a>
        <a class="btn btn-ghost" href="profile.html" data-track="after booking view profile">View in my profile</a>
        <a class="btn btn-ghost" href="feedback.html" data-track="after booking feedback">Tell us how that went</a>
      </div>
    </div>
  </div>`;

  if(window.YK) YK.track('confirmation_view', {category:'conversion', label:b.hotelName, value:b.total});
  App.reveals();

  // --- post-booking review popup ---
  showReviewModal(b);
}

function showReviewModal(b){
  const {$, esc} = App;
  // don't nag: only ask once per browser
  let asked = false;
  try{ asked = localStorage.getItem('yk_review_asked') === '1'; }catch(e){}
  if(asked) return;

  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Rate your experience">
      <div class="modal-ask">
        <span class="eyebrow">Booking confirmed</span>
        <h3>How was booking with us?</h3>
        <p class="muted">Your booking for ${esc(b.hotelName)} is set. Before you go — how would you rate the site?</p>
        <div class="star-rate" id="star-rate">
          ${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}
        </div>
        <div class="review-actions">
          <button class="btn btn-ghost btn-sm" id="review-skip" data-track="review skip">Maybe later</button>
        </div>
      </div>
      <div class="modal-thanks" id="modal-thanks">
        <span class="eyebrow">Thank you</span>
        <h3 id="thanks-head">Thanks for the feedback!</h3>
        <p class="muted" id="thanks-msg"></p>
        <button class="btn btn-primary btn-sm" id="review-done" data-track="review done">Done</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  requestAnimationFrame(()=> wrap.classList.add('show'));

  function close(){
    wrap.classList.remove('show');
    setTimeout(()=> wrap.remove(), 250);
    try{ localStorage.setItem('yk_review_asked','1'); }catch(e){}
  }

  const stars = wrap.querySelectorAll('#star-rate button');
  let chosen = 0;
  stars.forEach(btn => {
    const val = parseInt(btn.dataset.star,10);
    btn.addEventListener('mouseenter', ()=> stars.forEach(s=> s.classList.toggle('lit', parseInt(s.dataset.star,10)<=val)));
    btn.addEventListener('mouseleave', ()=> stars.forEach(s=> s.classList.toggle('lit', parseInt(s.dataset.star,10)<=chosen)));
    btn.addEventListener('click', ()=>{
      chosen = val;
      stars.forEach(s=> s.classList.toggle('lit', parseInt(s.dataset.star,10)<=chosen));
      if(window.YK) YK.track('site_rating', {category:'happiness', label:'post-booking', value:chosen});
      // store it
      try{
        const rs = JSON.parse(localStorage.getItem('yk_site_ratings')||'[]');
        rs.push({rating:chosen, when:new Date().toISOString()});
        localStorage.setItem('yk_site_ratings', JSON.stringify(rs));
      }catch(e){}
      // swap to thanks view
      wrap.querySelector('.modal-ask').style.display='none';
      const t = wrap.querySelector('#modal-thanks'); t.style.display='block';
      wrap.querySelector('#thanks-msg').textContent = chosen>=4
        ? 'So glad you enjoyed it. See you on the next trip!'
        : (chosen===3 ? 'Thanks — we\u2019ll keep working to make it better.'
                      : 'Sorry it fell short. Your rating helps us fix what\u2019s not working.');
      try{ localStorage.setItem('yk_review_asked','1'); }catch(e){}
    });
  });

  wrap.querySelector('#review-skip').addEventListener('click', close);
  wrap.querySelector('#review-done').addEventListener('click', close);
  wrap.addEventListener('click', e => { if(e.target===wrap) close(); });
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
