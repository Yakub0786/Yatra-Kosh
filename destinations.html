<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destinations · Yatra Kosh</title>
<meta name="description" content="All twenty destinations, grouped by region, with suggested trip lengths and the best months to travel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yatra Kosh">
<meta property="og:title" content="Destinations · Yatra Kosh">
<meta property="og:description" content="All twenty destinations, grouped by region, with suggested trip lengths and the best months to travel.">
<meta property="og:url" content="https://yakub0786.github.io/Yatra-Kosh/destinations.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Destinations · Yatra Kosh">
<meta name="twitter:description" content="All twenty destinations, grouped by region, with suggested trip lengths and the best months to travel.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="page-head">
  <div class="wrap">
    <span class="eyebrow on-dark">The catalogue</span>
    <h1>Twenty places, properly explained</h1>
    <p class="lede">Filter by region or interest, sort by price or trip length. Every card tells you when to actually go.</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="regiontabs" id="regiontabs" style="margin-bottom:22px"></div>
    <div class="filters">
      <div class="field"><label for="f-tag">Interest</label>
        <select id="f-tag"><option value="">Anything</option></select></div>
      <div class="field"><label for="f-nights">Trip length</label>
        <select id="f-nights">
          <option value="">Any length</option>
          <option value="short">Weekend (1–3 nights)</option>
          <option value="long">Longer (4+ nights)</option>
        </select></div>
      <div class="field"><label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="name">Name</option>
          <option value="price">Cheapest stay</option>
          <option value="stays">Most stays</option>
        </select></div>
      <button class="btn btn-ghost btn-sm" id="f-clear" data-track="clear destination filters">Clear</button>
    </div>
    <p class="mono muted" id="count" style="font-size:.8rem"></p>
    <div class="grid grid-3" id="list"></div>
    <div id="none"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$} = App;
  const tags = [...new Set(DESTINATIONS.flatMap(d=>d.tags))].sort();
  $('#f-tag').innerHTML += tags.map(t=>`<option>${t}</option>`).join('');

  let region = '';
  $('#regiontabs').innerHTML = '<button class="is-active" data-r="">All regions</button>' +
    REGIONS.map(r=>`<button data-r="${r}">${r}</button>`).join('');

  function draw(){
    const tag = $('#f-tag').value, len = $('#f-nights').value, sort = $('#f-sort').value;
    let out = DESTINATIONS.filter(d =>
      (!region || d.region===region) &&
      (!tag || d.tags.includes(tag)) &&
      (!len || (len==='short' ? d.nights<=3 : d.nights>=4)));
    out.sort((a,b) => sort==='price' ? a.fromPrice-b.fromPrice
                    : sort==='stays' ? b.hotelCount-a.hotelCount
                    : a.name.localeCompare(b.name));
    $('#count').textContent = out.length + ' OF ' + DESTINATIONS.length + ' DESTINATIONS';
    $('#list').innerHTML = out.map(App.destCard).join('');
    $('#none').innerHTML = out.length ? '' :
      '<div class="empty"><h3>Nothing matches those filters</h3><p class="muted">Clear one of them and try again.</p></div>';
    App.reveals();
    if(window.YK && (tag||len||region)) YK.track('filter', {category:'destinations', label:'region='+region+';tag='+tag+';length='+len+';sort='+sort, value:out.length});
  }
  $('#regiontabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    $$('#regiontabs button').forEach(x=>x.classList.remove('is-active'));
    b.classList.add('is-active'); region = b.dataset.r; draw();
  });
  ['f-tag','f-nights','f-sort'].forEach(id => $('#'+id).addEventListener('change', draw));
  $('#f-clear').addEventListener('click', () => {
    $('#f-tag').value=''; $('#f-nights').value=''; $('#f-sort').value='name';
    region=''; $$('#regiontabs button').forEach(x=>x.classList.remove('is-active'));
    $('#regiontabs button').classList.add('is-active');
    draw();
  });
  draw();
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
