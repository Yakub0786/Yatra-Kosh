<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ · Yatra Kosh</title>
<meta name="description" content="Booking, package, cancellation, payment and check-in questions answered.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="page-head">
  <div class="wrap">
    <span class="eyebrow on-dark">Help</span>
    <h1>Questions people actually ask</h1>
  </div>
</section>

<section class="section">
  <div class="wrap" style="max-width:820px">
    <div id="faq"></div>
    <div class="panel" style="margin-top:36px">
      <h3>Still stuck?</h3>
      <p class="muted">Write to us and we will answer within a working day.</p>
      <a class="btn btn-ink" href="contact.html" data-track="faq to contact">Contact the team</a>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$, esc} = App;
  $('#faq').innerHTML = FAQS.map((f,i) => `
    <div class="faq-item">
      <button class="faq-q" aria-expanded="false" aria-controls="a${i}">${esc(f[0])}</button>
      <div class="faq-a" id="a${i}">${esc(f[1])}</div>
    </div>`).join('');
  App.faqInit($('#faq'));
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
