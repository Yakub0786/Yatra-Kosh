<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Yatra Kosh</title>
<meta name="description" content="Create a free account to save trips, stays and enquiries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="section">
  <div class="wrap split" style="align-items:start">
    <div style="max-width:460px">
      <span class="eyebrow">Free, and always will be</span>
      <h1>Create an account</h1>
      <p class="lede">Saves your stays and package enquiries, remembers your dates, keeps every reference in one place.</p>

      <form class="panel" id="rform" data-form="registration" novalidate>
        <div class="form-grid">
          <div class="field"><label for="fname">First name</label>
            <input type="text" id="fname" name="fname" data-rule="required" autocomplete="given-name"><p class="field-error"></p></div>
          <div class="field"><label for="lname">Last name</label>
            <input type="text" id="lname" name="lname" data-rule="required" autocomplete="family-name"><p class="field-error"></p></div>
        </div>
        <div class="field"><label for="email">Email</label>
          <input type="email" id="email" name="email" data-rule="required,email" autocomplete="email"><p class="field-error"></p></div>
        <div class="field"><label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" data-rule="required,phone" placeholder="10 digits"><p class="field-error"></p></div>
        <div class="field"><label for="pw">Password <span class="hint">at least 6 characters</span></label>
          <input type="password" id="pw" name="pw" data-rule="required,pw" autocomplete="new-password"><p class="field-error"></p></div>
        <div class="field"><label for="city">Home city <span class="hint">optional — helps us suggest short trips</span></label>
          <input type="text" id="city" name="city" autocomplete="address-level2"></div>
        <div class="field">
          <label style="font-weight:400"><input type="checkbox" id="terms" style="width:auto;margin-right:6px">I agree to the booking and cancellation terms</label>
          <p class="field-error" id="terms-err" style="display:none">Please accept the terms to continue.</p>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-track="create account" data-cat="auth">Create account</button>
      </form>

      <p style="margin-top:18px">Already registered? <a href="login.html" data-track="register to login">Sign in</a>.</p>
      <div id="msg"></div>
    </div>
<div style="border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-2)" id="art"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$} = App;
  $('#art').innerHTML = Scene.make('fort','rose','register-art');
  $('#rform').addEventListener('submit', e => {
    e.preventDefault();
    let ok = App.validate(e.target);
    const t = $('#terms'), te = $('#terms-err');
    if(!t.checked){
      ok = false; te.style.display='block';
      e.target.dispatchEvent(new CustomEvent('yk:formerror',{detail:{field:'terms'}}));
    } else te.style.display='none';
    if(!ok) return;
    if(window.YK) YK.track('registration_success', {category:'adoption', label:'registration'});
    try{ localStorage.setItem('yk_signedin', $('#email').value.trim()); }catch(err){}
    $('#msg').innerHTML = '<div class="notice notice-ok" style="margin-top:16px">Account created. You are signed in.</div>';
    setTimeout(()=>location.href='destinations.html', 1000);
  });
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
