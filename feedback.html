<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback · Yatra Kosh</title>
<meta name="description" content="Rate the site and tell us whether you found what you were looking for.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="page-head">
  <div class="wrap">
    <span class="eyebrow on-dark">Feedback</span>
    <h1>Did this site do its job?</h1>
    <p class="lede">Four questions. Your answers feed the happiness and task-success measures in our analysis.</p>
  </div>
</section>

<section class="section">
  <div class="wrap" style="max-width:720px">
    <form class="panel" id="fform" data-form="feedback" novalidate>
      <div class="field">
        <label>How easy was it to use? <span class="hint">1 = painful, 5 = effortless</span></label>
        <div id="rate" style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn btn-ghost" data-v="1" data-track="rating 1">1</button>
          <button type="button" class="btn btn-ghost" data-v="2" data-track="rating 2">2</button>
          <button type="button" class="btn btn-ghost" data-v="3" data-track="rating 3">3</button>
          <button type="button" class="btn btn-ghost" data-v="4" data-track="rating 4">4</button>
          <button type="button" class="btn btn-ghost" data-v="5" data-track="rating 5">5</button>
        </div>
        <input type="hidden" id="rating" name="rating" data-rule="required">
        <p class="field-error"></p>
      </div>

      <div class="field"><label for="task">Did you finish what you came to do?</label>
        <select id="task" name="task" data-rule="required">
          <option value="">Choose one</option>
          <option value="yes">Yes, completely</option>
          <option value="partly">Partly</option>
          <option value="no">No</option>
        </select><p class="field-error"></p></div>

      <div class="field"><label for="hard">Which part was hardest?</label>
        <select id="hard" name="hard">
          <option value="none">Nothing was hard</option>
          <option value="find">Finding the right destination</option>
          <option value="package">Understanding a package's inclusions</option>
          <option value="search">Searching for a stay</option>
          <option value="compare">Comparing stays or packages</option>
          <option value="form">Filling the booking or enquiry form</option>
          <option value="mobile">Using it on my phone</option>
        </select></div>

      <div class="field"><label for="comment">Anything else? <span class="hint">optional</span></label>
        <textarea id="comment" name="comment" style="min-height:100px" placeholder="Be blunt. It is more useful than being kind."></textarea></div>

      <button class="btn btn-primary" type="submit" data-track="submit feedback" data-cat="form">Send feedback</button>
      <div id="done"></div>
    </form>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$, $$} = App;
  let value = 0;
  $$('#rate button').forEach(b => b.addEventListener('click', () => {
    value = parseInt(b.dataset.v,10);
    $('#rating').value = value;
    $$('#rate button').forEach(x => { x.classList.remove('btn-ink'); x.classList.add('btn-ghost'); });
    b.classList.remove('btn-ghost'); b.classList.add('btn-ink');
    if(window.YK) YK.track('rating_select', {category:'happiness', label:'ease of use', value:value});
  }));

  $('#fform').addEventListener('submit', e => {
    e.preventDefault();
    if(!App.validate(e.target)) return;
    if(window.YK) YK.track('feedback_submit', {
      category:'happiness',
      label:'task=' + $('#task').value + ';hardest=' + $('#hard').value,
      value:value
    });
    $('#done').innerHTML = '<div class="notice notice-ok" style="margin-top:16px">Thank you — that is genuinely useful.</div>';
  });
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
