<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Yatra Kosh</title>
<meta name="description" content="Sign in to see your saved trips, stays and enquiries.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yatra Kosh">
<meta property="og:title" content="Sign in · Yatra Kosh">
<meta property="og:description" content="Sign in to see your saved trips, stays and enquiries.">
<meta property="og:url" content="https://yakub0786.github.io/Yatra-Kosh/login.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Sign in · Yatra Kosh">
<meta name="twitter:description" content="Sign in to see your saved trips, stays and enquiries.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="section">
  <div class="wrap split" style="align-items:start">
    <div style="max-width:420px">
      <span class="eyebrow">Welcome back</span>
      <h1>Sign in</h1>
      <p class="lede">Saved trips, past bookings and enquiries live in your account.</p>

      <div class="notice notice-info" style="margin-top:20px">
        Demo site — any email and a password of six or more characters will sign you in.
      </div>

      <form class="panel" id="lform" data-form="login" novalidate>
        <div class="field"><label for="email">Email</label>
          <input type="email" id="email" name="email" data-rule="required,email" autocomplete="email"><p class="field-error"></p></div>
        <div class="field"><label for="pw">Password</label>
          <input type="password" id="pw" name="pw" data-rule="required,pw" autocomplete="current-password"><p class="field-error"></p></div>
        <div class="field" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <label style="margin:0;font-weight:400"><input type="checkbox" id="remember" style="width:auto;margin-right:6px">Keep me signed in</label>
          <a href="#" class="hint" data-track="forgot password">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-track="sign in" data-cat="auth">Sign in</button>
      </form>

      <p style="margin-top:18px">New here? <a href="register.html" data-track="login to register">Create an account</a>.</p>
      <div id="msg"></div>
    </div>
<div style="border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-2)" id="art"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$} = App;
  $('#art').innerHTML = Scene.make('backwater','forest','login-art');
  $('#lform').addEventListener('submit', e => {
    e.preventDefault();
    if(!App.validate(e.target)) return;
    try{ localStorage.setItem('yk_signedin', $('#email').value.trim()); }catch(err){}
    if(window.YK) YK.track('login_success', {category:'auth', label:'login'});
    $('#msg').innerHTML = '<div class="notice notice-ok" style="margin-top:16px">Signed in. Taking you to the destinations page.</div>';
    setTimeout(()=>{ const n=App.param('next'); location.href = n ? decodeURIComponent(n) : 'destinations.html'; }, 900);
  });
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
