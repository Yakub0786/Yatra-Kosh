<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destination · Yatra Kosh</title>
<meta name="description" content="Everything we offer in one destination — hotels and any package tour that includes it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yatra Kosh">
<meta property="og:title" content="Destination · Yatra Kosh">
<meta property="og:description" content="Everything we offer in one destination — hotels and any package tour that includes it.">
<meta property="og:url" content="https://yakub0786.github.io/Yatra-Kosh/destination.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Destination · Yatra Kosh">
<meta name="twitter:description" content="Everything we offer in one destination — hotels and any package tour that includes it.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<div class="wrap"><p class="crumb"><a href="index.html">Home</a> / <a href="destinations.html">Destinations</a> / <span id="cr">&hellip;</span></p></div>
<div id="body"></div>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$, param, esc, inr} = App;
  const d = DESTINATIONS.find(x => x.id === param('id'));
  const box = $('#body');

  if(!d){
    box.innerHTML = '<div class="wrap section"><div class="empty"><h3>That destination is not on our list</h3>' +
      '<p class="muted">It may have been removed, or the link is wrong.</p>' +
      '<a class="btn btn-primary" href="destinations.html">Browse all destinations</a></div></div>';
    if(window.YK) YK.track('not_found', {category:'error', label:'destination ' + param('id')});
    return;
  }

  document.title = d.name + ' · Yatra Kosh';
  $('#cr').textContent = d.name;
  const hotels = HOTELS.filter(h => h.dest === d.id);
  const relatedPkgs = PACKAGES.filter(p => p.dests.includes(d.id));

  box.innerHTML = `
  <section class="section" style="padding-top:26px">
    <div class="wrap">
      <div class="split" style="gap:34px">
        <div>
          <span class="eyebrow">${esc(d.state)} · ${esc(d.region)} INDIA</span>
          <h1>${esc(d.name)}</h1>
          <p class="lede">${esc(d.tagline)}</p>
          <p>${esc(d.blurb)}</p>
          <div class="hero-stats" style="margin-top:6px">
            <div><b style="color:var(--ink)">${d.nights}</b><span style="color:var(--muted)">Nights suggested</span></div>
            <div><b style="color:var(--ink)">${d.hotelCount}</b><span style="color:var(--muted)">Stays listed</span></div>
            <div><b style="color:var(--ink)">${inr(d.fromPrice)}</b><span style="color:var(--muted)">Cheapest night</span></div>
          </div>
          <p style="margin-top:20px"><b>Best months:</b> ${esc(d.best)}</p>
          <div class="pill-row" style="margin-top:10px">${d.tags.map(t=>`<span class="pill" style="cursor:default">${esc(t)}</span>`).join('')}</div>
          <p style="margin-top:22px">
            <a class="btn btn-ink" href="#stays" data-track="jump to stays ${esc(d.name)}">See ${d.hotelCount} stays</a>
            <a class="btn btn-ghost" href="assets/downloads/yatra-kosh-travel-guide.pdf" download data-track="download guide ${esc(d.name)}" data-cat="download">Travel guide (PDF)</a>
          </p>
        </div>
        <div id="dest-hero-art" style="border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-2);position:relative;aspect-ratio:4/3">${Scene.make(d.scene, d.palette, d.id)}</div>
      </div>
    </div>
  </section>

  ${relatedPkgs.length ? `
  <section class="section section--tint">
    <div class="wrap">
      <div class="section-head"><span class="eyebrow">Prefer it planned for you</span><h2>Package tours through ${esc(d.name)}</h2></div>
      <div class="grid grid-3">${relatedPkgs.map(App.packageCard).join('')}</div>
    </div>
  </section>` : ''}

  <section class="section" id="stays">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">Where to stay</span>
        <h2>${d.hotelCount} stays in ${esc(d.name)}</h2>
      </div>
      <div class="filters">
        <div class="field"><label for="s-sort">Sort by</label>
          <select id="s-sort">
            <option value="rating">Guest rating</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
          </select></div>
        <div class="field"><label for="s-max">Max per night</label>
          <select id="s-max">
            <option value="">Any price</option><option value="2500">Under ₹2,500</option>
            <option value="5000">Under ₹5,000</option><option value="9000">Under ₹9,000</option>
          </select></div>
      </div>
      <div class="stack" id="stays-list"></div>
      <div id="stays-none"></div>
    </div>
  </section>`;

  function draw(){
    const sort = $('#s-sort').value, max = parseInt($('#s-max').value||'0',10);
    let out = hotels.filter(h => !max || h.price <= max);
    out.sort((a,b)=> sort==='low' ? a.price-b.price : sort==='high' ? b.price-a.price : b.rating-a.rating);
    $('#stays-list').innerHTML = out.map(App.hotelTicket).join('');
    $('#stays-none').innerHTML = out.length ? '' :
      '<div class="empty"><h3>No stays under that price here</h3><p class="muted">Raise the limit, or try a cheaper destination.</p></div>';
    App.reveals();
    if(window.YK && max) YK.track('filter', {category:'hotels', label:d.name+' max='+max+' sort='+sort, value:out.length});
  }
  ['s-sort','s-max'].forEach(id => $('#'+id).addEventListener('change', draw));
  draw();

  if(window.Photos) Photos.fillPhoto($('#dest-hero-art'), d.id);
  if(window.YK) YK.track('destination_view', {category:'catalogue', label:d.name, value:d.hotelCount});
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
