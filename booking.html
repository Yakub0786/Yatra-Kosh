<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete your booking · Yatra Kosh</title>
<meta name="description" content="Guest details and dates for the stay you selected.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yatra Kosh">
<meta property="og:title" content="Complete your booking · Yatra Kosh">
<meta property="og:description" content="Guest details and dates for the stay you selected.">
<meta property="og:url" content="https://yakub0786.github.io/Yatra-Kosh/booking.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Complete your booking · Yatra Kosh">
<meta name="twitter:description" content="Guest details and dates for the stay you selected.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<div class="wrap"><p class="crumb"><a href="index.html">Home</a> / <a href="destinations.html">Destinations</a> / Booking</p></div>

<section class="section" style="padding-top:24px">
  <div class="wrap">
    <div class="steps">
      <div class="done">01 Choose a stay</div>
      <div class="done">02 Your details</div>
      <div>03 Confirmed</div>
    </div>

    <div class="split-side split-side--right">
      <div>
        <h1 style="font-size:clamp(1.7rem,4vw,2.4rem)">Who is travelling?</h1>
        <p class="lede">Nothing is charged now — you pay the property at check-in.</p>

        <form class="panel" id="bform" data-form="booking" novalidate style="margin-top:24px">
          <div class="form-grid">
            <div class="field"><label for="cin">Check in</label>
              <input type="date" id="cin" name="cin" data-rule="required,future"><p class="field-error"></p></div>
            <div class="field"><label for="cout">Check out</label>
              <input type="date" id="cout" name="cout" data-rule="required"><p class="field-error"></p></div>
            <div class="field"><label for="adults">Adults</label>
              <select id="adults" name="adults"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></div>
            <div class="field"><label for="children">Children <span class="hint">under 12</span></label>
              <select id="children" name="children"><option selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
          </div>
          <div class="notice notice-info" id="room-note" style="margin-bottom:18px"></div>

          <div class="field"><label for="name">Full name <span class="hint">as printed on your ID</span></label>
            <input type="text" id="name" name="name" data-rule="required" autocomplete="name"><p class="field-error"></p></div>

          <div class="form-grid">
            <div class="field"><label for="email">Email</label>
              <input type="email" id="email" name="email" data-rule="required,email" autocomplete="email"><p class="field-error"></p></div>
            <div class="field"><label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone" data-rule="required,phone" autocomplete="tel" placeholder="10 digits"><p class="field-error"></p></div>
          </div>

          <div class="field"><label for="notes">Anything the property should know <span class="hint">optional</span></label>
            <textarea id="notes" name="notes" style="min-height:88px" placeholder="Late arrival, ground floor room, vegetarian meals&hellip;"></textarea></div>

          <div class="field"><label for="coupon">Coupon code <span class="hint">optional</span></label>
            <div class="coupon-row">
              <input type="text" id="coupon" placeholder="e.g. WELCOME10">
              <button class="btn btn-ghost btn-sm" type="button" id="coupon-apply" data-track="apply coupon">Apply</button>
            </div>
            <p class="coupon-msg" id="coupon-msg"></p>
          </div>

          <div class="field">
            <label>Payment method</label>
            <div class="pay-options" id="pay-options">
              <label class="pay-option is-active"><input type="radio" name="paymethod" value="upi" checked><span class="pay-icon">📱</span>UPI</label>
              <label class="pay-option"><input type="radio" name="paymethod" value="card"><span class="pay-icon">💳</span>Card</label>
              <label class="pay-option"><input type="radio" name="paymethod" value="cash"><span class="pay-icon">💵</span>Cash at property</label>
            </div>
            <p class="hint" style="margin-top:8px">You pay at the property on arrival — no card details are collected here.</p>
          </div>

          <button class="btn btn-primary btn-block" type="submit" data-track="confirm booking" data-cat="conversion">Confirm booking</button>
          <p class="hint center" style="margin:12px 0 0">Free cancellation until 72 hours before check-in.</p>
        </form>
      </div>

      <aside><div class="panel" id="summary" style="position:sticky;top:88px"></div></aside>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$, $$, param, esc, inr} = App;
  const h = HOTELS.find(x => x.id === param('hotel')) || HOTELS[0];
  let discount = 0, couponCode = '';

  // --- sign-in is required to book ---
  if(!App.currentUser()){
    const main = $('#main');
    if(main){
      const dest = encodeURIComponent('booking.html' + location.search);
      main.innerHTML = `
        <section class="section">
          <div class="wrap" style="max-width:520px">
            <div class="panel" style="text-align:center;padding:44px 28px">
              <span class="eyebrow">One quick step</span>
              <h1 style="font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:8px">Sign in to complete your booking</h1>
              <p class="lede center" style="margin-inline:auto">Booking a stay needs an account — it keeps your reservation, dates and confirmation reference in one place. It takes a moment.</p>
              <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px">
                <a class="btn btn-primary" href="login.html?next=${dest}" data-track="booking gate sign in">Sign in</a>
                <a class="btn btn-ghost" href="register.html?next=${dest}" data-track="booking gate register">Create account</a>
              </div>
              <p class="hint" style="margin-top:18px">You were booking <b>${esc(h.name)}</b>. We'll bring you right back here.</p>
            </div>
          </div>
        </section>`;
    }
    if(window.YK) YK.track('booking_gate_shown', {category:'auth', label:h.name});
    return;
  }

  const MAX_ADULTS_PER_ROOM = 3;
  const todayStr = App.today();

  // --- date setup with proper constraints ---
  const cin = $('#cin'), cout = $('#cout');
  cin.min = todayStr;                         // can't check in before today
  cin.value  = param('cin')  || App.plus(7);
  cout.value = param('cout') || App.plus(10);

  function clampDates(changed){
    // check-in can't be in the past
    if(cin.value < todayStr) cin.value = todayStr;
    // check-out must be at least one day after check-in
    const minOut = App.plus(0); // placeholder
    const inDate = new Date(cin.value);
    const dayAfterIn = new Date(inDate.getTime() + 864e5).toISOString().slice(0,10);
    cout.min = dayAfterIn;                     // browser blocks earlier dates
    if(cout.value <= cin.value){
      // if user just changed checkout to something invalid, or checkin passed checkout
      cout.value = dayAfterIn;
    }
  }

  function nights(){
    const a = new Date(cin.value), b = new Date(cout.value);
    return Math.max(1, Math.round((b-a)/864e5) || 1);
  }

  // rooms are computed from adults (3 adults max per room; children don't count toward the cap)
  function roomsNeeded(){
    const adults = parseInt($('#adults').value,10);
    return Math.max(1, Math.ceil(adults / MAX_ADULTS_PER_ROOM));
  }

  function updateRoomNote(){
    const adults = parseInt($('#adults').value,10);
    const children = parseInt($('#children').value,10);
    const rooms = roomsNeeded();
    const guestText = adults + (adults===1?' adult':' adults') +
      (children? ' + ' + children + (children===1?' child':' children') : '');
    $('#room-note').innerHTML =
      `<b>${rooms} room${rooms>1?'s':''}</b> for ${guestText}` +
      (rooms>1 ? ` — we split into ${rooms} rooms because each room holds up to ${MAX_ADULTS_PER_ROOM} adults. Children stay with you at no extra room.`
               : ` — one room holds up to ${MAX_ADULTS_PER_ROOM} adults; children stay with you at no extra room.`);
  }

  function summary(){
    const n = nights(), r = roomsNeeded();
    const adults = parseInt($('#adults').value,10);
    const children = parseInt($('#children').value,10);
    const sub = h.price*n*r, tax = Math.round((sub-discount)*0.12);
    const total = Math.max(0, sub - discount) + tax;
    $('#summary').innerHTML = `
      <span class="eyebrow">Your stay</span>
      <div style="border-radius:var(--r-md);overflow:hidden;margin-bottom:14px">${Scene.make(h.scene,h.palette,h.id)}</div>
      <h3 style="margin-bottom:2px">${esc(h.name)}</h3>
      <p class="ticket-loc" style="margin-bottom:14px">${esc(h.area)} · ${esc(h.destName)}</p>
      <div class="boarding-row"><span>Dates</span><span>${esc(cin.value)} → ${esc(cout.value)}</span></div>
      <div class="boarding-row"><span>Guests</span><span>${adults} adult${adults>1?'s':''}${children?', '+children+' child'+(children>1?'ren':''):''}</span></div>
      <div class="boarding-row"><span>${inr(h.price)} × ${n} night${n>1?'s':''} × ${r} room${r>1?'s':''}</span><span>${inr(sub)}</span></div>
      ${discount ? `<div class="boarding-row"><span>Coupon ${esc(couponCode)}</span><span>&minus;${inr(discount)}</span></div>` : ''}
      <div class="boarding-row"><span>GST (12%)</span><span>${inr(tax)}</span></div>
      <div class="boarding-row" style="border:none;font-weight:600"><span>Payable at property</span><span>${inr(total)}</span></div>`;
    return {n, rooms:r, adults, children, sub, tax, total, discount, couponCode};
  }

  function refresh(){ clampDates(); updateRoomNote(); summary(); }

  cin.addEventListener('change', () => { clampDates('cin'); updateRoomNote(); summary(); });
  cout.addEventListener('change', () => { clampDates('cout'); updateRoomNote(); summary(); });
  $('#adults').addEventListener('change', refresh);
  $('#children').addEventListener('change', refresh);
  refresh();

  $('#coupon-apply').addEventListener('click', () => {
    const code = $('#coupon').value.trim();
    const msg = $('#coupon-msg');
    if(!code){ return; }
    const sub = h.price * nights() * roomsNeeded();
    const res = App.applyCoupon(code, sub, 'hotel');
    msg.classList.remove('ok','err'); msg.classList.add('show');
    if(res.ok){
      discount = res.discount; couponCode = res.code;
      msg.textContent = res.message; msg.classList.add('ok');
      if(window.YK) YK.track('coupon_applied', {category:'conversion', label:res.code, value:res.discount});
    } else {
      discount = 0; couponCode = '';
      msg.textContent = res.message; msg.classList.add('err');
    }
    summary();
  });

  $$('input[name="paymethod"]').forEach(input => {
    input.addEventListener('change', () => {
      $$('.pay-option').forEach(l => l.classList.remove('is-active'));
      input.closest('.pay-option').classList.add('is-active');
      if(window.YK) YK.track('payment_method_selected', {category:'conversion', label:input.value});
    });
  });

  $('#bform').addEventListener('submit', e => {
    e.preventDefault();
    if(!App.validate(e.target)) return;
    const s = summary();
    const ref = 'YK' + Math.random().toString(36).slice(2,8).toUpperCase();
    const payMethod = ($$('input[name="paymethod"]').find(i => i.checked) || {}).value || 'upi';
    const booking = {
      ref, hotel:h.id, hotelName:h.name, area:h.area, dest:h.destName,
      scene:h.scene, palette:h.palette,
      cin:$('#cin').value, cout:$('#cout').value,
      adults:s.adults, children:s.children,
      guests:(s.adults + s.children), rooms:s.rooms, nights:s.n, total:s.total,
      discount:s.discount, couponCode:s.couponCode, payMethod,
      name:$('#name').value.trim(), email:$('#email').value.trim(), phone:$('#phone').value.trim()
    };
    try{ sessionStorage.setItem('yk_booking', JSON.stringify(booking)); }catch(err){}
    try{
      const hist = JSON.parse(localStorage.getItem('yk_bookings')||'[]');
      hist.unshift(booking);
      localStorage.setItem('yk_bookings', JSON.stringify(hist.slice(0,20)));
    }catch(err){}
    if(window.YK) YK.track('booking_complete', {category:'conversion', label:h.name, value:s.total});
    location.href = 'confirmation.html';
  });

  if(window.YK) YK.track('booking_start', {category:'conversion', label:h.name, value:h.price});
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
