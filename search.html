<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search · Yatra Kosh</title>
<meta name="description" content="Search every destination, stay and package tour by name, area, theme or amenity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yatra Kosh">
<meta property="og:title" content="Search · Yatra Kosh">
<meta property="og:description" content="Search every destination, stay and package tour by name, area, theme or amenity.">
<meta property="og:url" content="https://yakub0786.github.io/Yatra-Kosh/search.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Search · Yatra Kosh">
<meta name="twitter:description" content="Search every destination, stay and package tour by name, area, theme or amenity.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">

<section class="page-head">
  <div class="wrap">
    <span class="eyebrow on-dark">Search</span>
    <h1>Look for a place, a stay, or a route</h1>
    <form id="sform" data-form="search" novalidate style="max-width:640px;margin-top:22px">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:220px;margin:0">
          <label class="visually-hidden" for="q" style="color:#A9B7CC">Search stays, destinations and packages</label>
          <input type="search" id="q" name="q" placeholder="houseboat, Rajasthan, honeymoon, spa&hellip;" data-rule="required" autocomplete="off">
          <p class="field-error" style="color:#F4B0A8"></p>
        </div>
        <button class="btn btn-primary" type="submit" data-track="run search" data-cat="search">Search</button>
      </div>
    </form>
    <p class="mono" style="color:#8496B0;font-size:.74rem;margin-top:14px">
      TRY: <a href="?q=houseboat" data-track="suggested search houseboat">houseboat</a> ·
      <a href="?q=honeymoon" data-track="suggested search honeymoon">honeymoon</a> ·
      <a href="?q=Rajasthan" data-track="suggested search rajasthan">Rajasthan</a> ·
      <a href="?q=spa" data-track="suggested search spa">spa</a> ·
      <a href="?q=Ladakh" data-track="suggested search ladakh">Ladakh</a>
    </p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div id="status"></div>
    <div id="pkgs" class="grid grid-3" style="margin-bottom:34px"></div>
    <div id="dests" class="grid grid-3" style="margin-bottom:34px"></div>
    <div id="hotels" class="stack"></div>
  </div>
</section>
</main>
<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/photos.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/scene.js"></script>
<script src="assets/js/app.js"></script>
<script>

function pageInit(){
  const {$, param, esc} = App;

  function show(q){
    const res = App.runSearch(q);
    const n = res.hotels.length + res.dests.length + res.packages.length;

    if(window.YK){
      YK.track('search', {category:'search', label:q, query:q, results:n});
      if(n === 0) YK.track('search_no_result', {category:'search', label:q, query:q, results:0});
    }

    if(!q){
      $('#status').innerHTML = '<div class="empty"><h3>Start typing to search</h3><p class="muted">Property names, destinations, package themes, and amenities all work.</p></div>';
      $('#pkgs').innerHTML=''; $('#dests').innerHTML = ''; $('#hotels').innerHTML = ''; return;
    }

    if(n === 0){
      const hint = App.suggestFor(q);
      $('#status').innerHTML =
        '<div class="empty"><h3>Nothing matched &ldquo;' + esc(q) + '&rdquo;</h3>' +
        (hint ? '<p class="muted">' + hint + '</p>' : '<p class="muted">Check the spelling, or try a broader word like &ldquo;beach&rdquo; or &ldquo;mountains&rdquo;.</p>') +
        '<p style="margin-top:18px"><a class="btn btn-primary btn-sm" href="destinations.html" data-track="no result browse all">Browse all destinations</a></p></div>';
      $('#pkgs').innerHTML = '';
      $('#dests').innerHTML = DESTINATIONS.slice(0,3).map(App.destCard).join('');
      $('#hotels').innerHTML = '';
      App.reveals(); return;
    }

    $('#status').innerHTML = '<p class="mono muted" style="font-size:.8rem">' + n +
      ' RESULTS FOR &ldquo;' + esc(q).toUpperCase() + '&rdquo;</p>';
    $('#pkgs').innerHTML   = res.packages.map(App.packageCard).join('');
    $('#dests').innerHTML  = res.dests.map(App.destCard).join('');
    $('#hotels').innerHTML = res.hotels.map(App.hotelTicket).join('');
    App.reveals();
  }

  const q0 = param('q');
  $('#q').value = q0;
  show(q0);

  $('#sform').addEventListener('submit', e => {
    e.preventDefault();
    if(!App.validate(e.target)) return;
    const q = $('#q').value.trim();
    history.replaceState(null,'','search.html?q=' + encodeURIComponent(q));
    show(q);
  });
}

</script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
